name: coreflow_design_system
description: >-
  O DS-FILHO do Conta BOLD. Fornece a paleta da marca (rosa → vinho) e recebe a
  linguagem inteira do ds-diletta: ~50 papéis derivados, dark mode sem escrever cor,
  354 ícones herdados. O que é só do Bold mora aqui; o que é linguagem mora no pai.
version: 0.85.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # UM só, e por TAG. O modo mudou na v0.8.0 do pai, e a razão é a fronteira e não o
  # artefato: o sync existia porque o build do app de um CLIENTE não pode depender da infra
  # do fornecedor. O Conta BOLD é produto interno da Diletta, então essa razão não se aplica
  # — não há quebra dentro da empresa.
  #
  # O que isso apaga: o passo de sync, o `.sync.json`, e a classe inteira de defeito "editei
  # a cópia" (sem cópia local não há drift). Subir de versão é trocar o `ref:`.
  #
  # O que isso NÃO muda: receber o pai mais barato não dá direito de editá-lo. Conserto vai
  # pro pai, sai numa tag, e volta no `ref:`.
  diletta_design_system:
    git:
      url: git@bitbucket.org:diletta/ds-diletta.git
      ref: v0.148.0
      path: packages/diletta_design_system
  # Declarado direto porque este pacote CHAMA `SvgPicture`/`ColorMapper` nas 26 artes deste
  # produto. Vinha de carona pelo pai — e dependência de carona é dependência que some sem
  # aviso na versão em que o pai parar de usá-la.
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Só pro gate da fonte: ele lê o próprio `pubspec` pra conferir que todo peso declarado tem
  # arquivo. Ler a declaração em vez de repetir a lista é o que impede o teste de concordar
  # com um erro que ele deveria pegar.
  yaml: ^3.1.2

flutter:
  # O pai declara `uses-material-design: true` (ele usa ícone do Material em fallback), e
  # sem a chave aqui o `flutter test` avisa em toda execução. Ruído em toda run é ruído que
  # se aprende a ignorar, e aí o aviso seguinte também passa batido.
  uses-material-design: true

  # O LOGO viaja aqui desde 20/08, e ele é o segundo asset deste pacote.
  #
  # O plugue do pai (`DilettaBrand`) carrega o arquivo do FILHO, e o veredito da `v0.120.0` deu o
  # canal que faltava: `logoTingePorCurrentColor`. O lockup tem 8 `fill` de letra que viram com o
  # tema e 1 gradiente de 8 paradas que não vira — as letras dizem `currentColor` no arquivo, e é o
  # ARQUIVO que decide o alcance da tinta em vez de a peça adivinhar por hex.
  #
  # **Dois arquivos viraram um.** O app tinha `bold-wordmark-light.svg` e `-brand.svg`, idênticos
  # exceto pelos 8 fills (branco contra preto). Com a tinta vindo do tema, a diferença some.
  assets:
    - assets/logos/
    # As 16 artes DESTE produto (8 nomes × claro/escuro). Vieram do app em 20/08 e a
    # mudança não é de pasta: aqui elas passam pelo `colorMapper`, então **a arte segue a
    # paleta**. No app eram SVG cru com o rosa cozido — trocar de paleta trocava tudo menos
    # a ilustração. As artes cujo nome é do PAI não moram aqui: `key_word` e `no_data` são a
    # peça dele.
    - assets/illustrations/

  # A FONTE DA MARCA viaja neste pacote. Ícone é vocabulário e vem do pai (medido: 310 dos
  # 354 nomes já eram os mesmos); ILUSTRAÇÃO é metade e metade — 13 nomes são deste produto
  # e os outros vêm dele.
  #
  # Empacotada em vez de resolvida por `google_fonts` de propósito: fonte de marca que
  # depende de download é fonte que às vezes não é a da marca — no primeiro launch, no
  # avião, na rede do cliente. É o que o primeiro filho faz com a dele.
  #
  # Inter v4.0, SIL Open Font License 1.1 (`assets/fonts/OFL.txt` viaja junto, como a
  # licença exige). Os cinco pesos são os mesmos degraus que o mapa da tipografia usa.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
