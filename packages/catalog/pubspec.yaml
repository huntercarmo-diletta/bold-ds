name: conta_bold_catalog
description: >-
  Catálogo do DS do Conta BOLD. É CONSUMIDOR do design system, igual ao app — não tem
  componente próprio. O motor (barra, board, compositor, codegen) vem do pai por tag.
publish_to: none
version: 0.15.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # A identidade e a linguagem. Por PATH porque catálogo e DS versionam juntos dentro
  # deste repo — a entrega pro app do cliente é outra coisa (ver tool/sincroniza_pai_ds.py).
  conta_bold_design_system:
    path: ../conta_bold_design_system

  # O pai FERRAMENTA, por TAG. Subir de versão é trocar o `ref` aqui, de propósito:
  # upgrade é escolha do filho.
  #
  # UM só: o motor reexporta o contrato. Declarar os dois dá conflito de resolução —
  # o `path:` interno do monorepo do pai resolve como COMMIT, e o pub trata tag e
  # commit como descrições diferentes.
  diletta_catalog_core:
    git:
      url: git@bitbucket.org:diletta/catalogo-diletta.git
      ref: v0.86.1
      path: packages/diletta_catalog_core

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # A ARTE DE DEMONSTRAÇÃO do fundo de imagem, e ela mora AQUI de propósito.
    #
    # O `BoldBackground` recebe a arte pelo `BoldBackdropScope` justamente pra não cravar caminho de
    # asset do app dentro do DS — sem isso o componente não renderiza fora do app. Mas o catálogo
    # também é um consumidor, e ele não declarava nada: o mood `imagem`, que é o fundo da HOME, aparecia
    # degradado (véu + brilho, sem cidade).
    #
    # Estas duas são CÓPIA REDUZIDA da arte do app (1 MB → ~120 KB, `sips -Z 1000`), e o nome diz que são
    # demo. A arte de produção é do app e continua lá; se ela mudar, esta fica velha — e é por isso que
    # ela é demo e não "a arte".
    - assets/demo/
