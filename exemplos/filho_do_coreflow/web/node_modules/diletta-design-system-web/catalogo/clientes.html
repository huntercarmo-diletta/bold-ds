<!doctype html><html lang="pt-BR" data-theme="light">
<!-- A TELA DE CLIENTES do CPF Seguro, montada só com peça do DS.
     Serve de prova e de régua: as medidas dela foram comparadas pixel a pixel
     com o nó 4123:16135 do Figma. O que o DS ainda não alcança está marcado
     à vista, em vermelho tracejado, com o nome da peça que falta. --><head><meta charset="utf-8">
<link rel="stylesheet" href="../../diletta_design_system/tokens/generated/cps-tokens.css">
<link rel="stylesheet" href="../../diletta_design_system/tokens/generated/cps-papeis.css">
<style>
  html,body{margin:0;height:1027px;font:14px/1.4 system-ui,sans-serif;color:var(--cps-fg)}
  body{background:var(--cps-bg);display:grid;grid-template-rows:72px 1fr}
  .corpo{display:grid;grid-template-columns:71px 1fr;min-height:0}
  .rail{background:var(--cps-bg);border-right:1px solid var(--cps-borderSubtle);padding-top:36px}
  .painel{background:var(--cps-surface);overflow:hidden}
  /* O RITMO É MEDIDO, não escolhido. Do metadado do Container em (325,104):
     32 · trilha 16 · 24 · título 38 · 8 · subtítulo 20 · 32 · abas 48 · 16
     · barra de filtro 28 · 16 · chips 24 · 32 · lista em y=406. */
  .container{width:950px;margin-left:254px;padding-top:32px;display:flex;flex-direction:column;gap:0}
  .titulo{display:flex;align-items:center;gap:8px;height:38px;margin:24px 0 8px}
  .titulo h1{font-size:26px;line-height:38px;font-weight:600;margin:0}
  .sub{color:var(--cps-textSecondary);height:20px;line-height:20px;margin:0 0 32px}
  /* 16 acima e 16 abaixo, medidos. A ALTURA é 48 e não 28 porque aqui entra o
     `input` de formulário no lugar do `search-input` de 28, que não tem
     instância web. Fixar 28 fazia o campo transbordar e cobrir a sublinha da
     aba — o custo da substituição, à vista. */
  .filtros{display:flex;align-items:center;gap:8px;min-height:48px;margin:16px 0}
  .aplicados{display:flex;align-items:center;gap:8px;height:24px;margin-bottom:32px;
    color:var(--cps-textSecondary);font-size:12px}
  diletta-data-row::part(linha){display:grid;grid-template-columns:1fr 200px 160px 150px 96px}
  /* FALTA: peça do DS sem instância web. Marcada à vista de propósito. */
  .falta{border:1px dashed var(--cps-error);border-radius:6px;color:var(--cps-error);
    font-size:11px;padding:0 6px;display:inline-flex;align-items:center;gap:4px;height:28px;
    white-space:nowrap}
  .falta.bloco{height:38px;width:38px;justify-content:center;padding:0}
</style></head><body>

<diletta-web-top-bar nome="Josicleisson Santos" papel="Administrador Geral">
  <strong slot="marca" style="color:var(--cps-primary);font-size:18px">CPF</strong>
  <diletta-icon-button slot="atalhos" size="sm" rotulo="Notificações"><svg viewBox="0 0 24 24"><path d="M12 4a5 5 0 015 5v3l1.5 2.5H5.5L7 12V9a5 5 0 015-5zM10 18a2 2 0 004 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg></diletta-icon-button><diletta-icon-button slot="atalhos" size="sm" rotulo="Idioma"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M4 12h16M12 4c2.5 2.5 2.5 13 0 16M12 4c-2.5 2.5-2.5 13 0 16" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></diletta-icon-button>
</diletta-web-top-bar>

<div class="corpo">
  <nav class="rail">
    <diletta-rail-item rotulo="Cadastros" estado="ativo" forma="recolhido">
      <svg slot="icone" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"
        fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 10h4M7 14h7"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </diletta-rail-item>
    <diletta-rail-item rotulo="Usuários" forma="recolhido">
      <svg slot="icone" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.2" fill="none"
        stroke="currentColor" stroke-width="1.8"/><path d="M5 19c0-3.2 3.1-5 7-5s7 1.8 7 5"
        fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </diletta-rail-item>
  </nav>

  <main class="painel"><div class="container">
    <diletta-breadcrumb style="height:16px" trilha="Cadastros"></diletta-breadcrumb>
    <div class="titulo">
      <diletta-spot-icon forma="ladrilho" state="primary" size="38"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 10h4M7 14h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></diletta-spot-icon>
      <h1>Cadastros</h1>
    </div>
    <p class="sub">Aqui você gerencia os cadastros em andamento.</p>

    <diletta-tabs abas="Página principal|Onboarding em andamento" selecionada="0"></diletta-tabs>

    <div class="filtros">
      <div style="width:334px" title="referência usa search-input de 28; aqui é input de 48">
        <diletta-input placeholder="Pesquisar"></diletta-input></div>
      <diletta-button size="sm" type="secondary" rotulo="Filtros"></diletta-button>
      <diletta-button size="sm" type="secondaryPrimary" style="margin-left:auto"
        rotulo="Exportar cadastros"></diletta-button>
    </div>
    <div class="aplicados">Filtros aplicados:
      <diletta-input-chip label="De 01/01/2020 até 21/11/2024" removivel></diletta-input-chip>
    </div>

    <diletta-data-list id="lista" rotulo="Cadastros"
      colunas="Nome:1fr | CPF:200 | Data de criação:160 | Estado:150 | :96"
      contagem="Exibindo 1-20 de 200" paginas="10" atual="1"></diletta-data-list>
  </div></main>
</div>

<script type="module">
import '../index.js';
const dados=[['João Carlos','123.456.789-0','10/02/2022','Pendente','aviso'],
 ['João Carlos','123.456.789-0','10/02/2022','Pendente','aviso'],
 ['João Carlos','123.456.789-0','10/02/2022','Aprovado','sucesso'],
 ['João Carlos','123.456.789-0','10/02/2022','Negada','erro'],
 ['João Carlos','123.456.789-0','10/02/2022','Aprovado','sucesso'],
 ['João Carlos','123.456.789-0','10/02/2022','Negada','erro'],
 ['João Carlos','123.456.789-0','10/02/2022','Aprovado','sucesso']];
// A TARJA da linha e o TOM da tag são eixos de peças diferentes, e o mapa entre
// eles é do PRODUTO, não do DS: a linha fala aviso/erro/sucesso, a tag fala
// warning/danger/success. Escrever o mapa aqui é o certo — pôr um alias no DS
// faria uma peça saber o vocabulário da outra.
const TOM = { aviso: 'warning', erro: 'danger', sucesso: 'success' };
document.getElementById('lista').innerHTML = dados.map(([n,c,d,e,st])=>`
  <diletta-data-row estado="${st}">
    <diletta-data-cell conteudo="pessoa" valor="${n}"></diletta-data-cell>
    <diletta-data-cell valor="${c}"></diletta-data-cell>
    <diletta-data-cell valor="${d}"></diletta-data-cell>
    <diletta-data-cell conteudo="estado"><diletta-status-tag tone="${TOM[st]}" label="${e}"></diletta-status-tag></diletta-data-cell>
    <diletta-data-cell conteudo="acao" alinhamento="fim"><diletta-icon-button size="sm" rotulo="Abrir detalhe de ${n}"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></diletta-icon-button></diletta-data-cell>
  </diletta-data-row>`).join('');
</script></body></html>
