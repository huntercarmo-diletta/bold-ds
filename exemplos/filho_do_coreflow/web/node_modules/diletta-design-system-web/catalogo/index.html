<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo web · Diletta Design System</title>
  <link rel="stylesheet" href="../../diletta_design_system/tokens/generated/cps-tokens.css">
  <link rel="stylesheet" href="../../diletta_design_system/tokens/generated/cps-papeis.css">
  <style>
    body {
      margin: 0; padding: 24px;
      background: var(--cps-bg); color: var(--cps-fg);
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .nota { color: var(--cps-textSecondary); font-size: 13px; margin: 0 0 24px; max-width: 60ch; }
    section { border-top: 1px solid var(--cps-border); padding: 20px 0; }
    h2 { font-size: 15px; margin: 0 0 2px; }
    .slug { color: var(--cps-textMuted); font-size: 12px; font-family: ui-monospace, monospace; }
    .grade { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 14px; }
    .caso { display: flex; flex-direction: column; gap: 6px; }
    .rotulo { color: var(--cps-textMuted); font-size: 11px; font-family: ui-monospace, monospace; }
    button.modo {
      position: fixed; top: 16px; right: 16px;
      background: var(--cps-surface); color: var(--cps-fg);
      border: 1px solid var(--cps-border); border-radius: 999px;
      padding: 8px 14px; min-height: 44px; cursor: pointer; font: inherit;
    }
  </style>
</head>
<body>
  <button class="modo" type="button" id="modo">Modo escuro</button>
  <h1>Catálogo web</h1>
  <p class="nota">
    A instância WEB da linguagem. Cada peça aqui responde à mesma spec que o widget
    Dart do outro lado — não é um DS paralelo. A cor sai de <code>--cps-*</code>, os
    papéis semânticos que a fase 1 do ADR-007 levou para a web.
  </p>
  <main id="raiz"></main>
  <script type="module">
    import { blocos } from './blocos.js';
    for (const b of blocos) await import(`../src/${b.tag}.js`);

    const combinacoes = (eixos) => {
      const nomes = Object.keys(eixos);
      return nomes.reduce(
        (acc, n) => acc.flatMap((c) => eixos[n].map((v) => ({ ...c, [n]: v }))),
        [{}],
      );
    };

    const raiz = document.getElementById('raiz');
    for (const b of blocos) {
      const sec = document.createElement('section');
      sec.innerHTML = `<h2>${b.tag}</h2><div class="slug">${b.slug}</div>`;
      const grade = document.createElement('div');
      grade.className = 'grade';
      for (const c of combinacoes(b.eixos)) {
        const caso = document.createElement('div');
        caso.className = 'caso';
        const el = document.createElement(b.tag);
        for (const [k, v] of Object.entries({ ...b.fixos, ...c })) {
          if (k === 'texto' && b.tag === 'diletta-text-link') el.textContent = v;
          else if (v !== '') el.setAttribute(k, v);
        }
        const rot = document.createElement('div');
        rot.className = 'rotulo';
        rot.textContent = Object.entries(c).map(([k, v]) => `${k}=${v || '—'}`).join(' · ');
        caso.append(el, rot);
        grade.append(caso);
      }
      sec.append(grade);
      raiz.append(sec);
    }

    const botao = document.getElementById('modo');
    botao.addEventListener('click', () => {
      const escuro = document.documentElement.dataset.theme === 'dark';
      document.documentElement.dataset.theme = escuro ? 'light' : 'dark';
      botao.textContent = escuro ? 'Modo escuro' : 'Modo claro';
    });
  </script>
</body>
</html>
